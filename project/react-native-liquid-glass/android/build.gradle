plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.localglass'
version = '1.0.0'

dependencies {
  implementation project(':liquidglass-core')
}

android {
  namespace "expo.modules.localglass"
